name: II Laravel-only CI
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: laravel_app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Verify Laravel Tinker one-shot execution
        run: php artisan tinker --execute="echo 'II_TINKER_CI=PASS';"
      - run: php artisan test
      - run: php artisan route:list
      - name: Assert active Laravel app has no Python runtime bridge
        run: '! grep -R -E "127\.0\.0\.1:8811|FastAPI|subprocess.*python|python(3)? " app config routes resources --exclude-dir=vendor'
