name: II VS1 Synthetic CI
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile candidate code
        run: python -m compileall -q app legacy tests
      - name: Synthetic functional tests
        run: python -m pytest -q
