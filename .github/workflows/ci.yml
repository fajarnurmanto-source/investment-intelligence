name: II Laravel-only CI
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: laravel_app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Parse PowerShell Windows test runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            '../tools/testing/Invoke-II-AutomatedTests.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify Laravel Tinker one-shot execution
        run: php artisan tinker --execute="echo 'II_TINKER_CI=PASS';"
      - run: php artisan test
      - run: php artisan route:list
      - name: Assert active Laravel app has no Python runtime bridge
        run: '! grep -R -E "127\.0\.0\.1:8811|FastAPI|subprocess.*python|python(3)? " app config routes resources --exclude-dir=vendor'

  windows-isolated-tinker-and-phpunit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Run real Windows isolated Tinker + PHPUnit runner
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ".\\tools\\testing\\Invoke-II-AutomatedTests.ps1"
