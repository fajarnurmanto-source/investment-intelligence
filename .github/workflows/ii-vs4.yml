name: II VS4 Workspace CI
on:
  pull_request:
    branches: [development]
    paths: ['hybrid_vs4/**', '.github/workflows/ii-vs4.yml']
  push:
    branches: [development]
    paths: ['hybrid_vs4/**', '.github/workflows/ii-vs4.yml']
permissions:
  contents: read
jobs:
  workspace-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Reconstruct Laravel and test VS4 overlay
        shell: bash
        run: |
          set -euo pipefail
          php -l hybrid_vs4/app/Http/Controllers/ResearchWorkspaceController.php
          composer create-project laravel/laravel /tmp/ii-vs4-ci '^13.0' --no-interaction --prefer-dist
          cd /tmp/ii-vs4-ci
          cp "$GITHUB_WORKSPACE/hybrid_vs4/app/Http/Controllers/ResearchWorkspaceController.php" app/Http/Controllers/
          mkdir -p resources/views/ii
          cp "$GITHUB_WORKSPACE/hybrid_vs4/resources/views/ii/workspace.blade.php" resources/views/ii/
          cat "$GITHUB_WORKSPACE/hybrid_vs4/route_fragment.php" >> routes/web.php
          php -l routes/web.php
          php artisan view:cache
          php artisan route:list --path=ii/workspace --json > /tmp/ii-vs4-routes.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/ii-vs4-routes.json'))
          targets={'ii/workspace':'GET|HEAD','ii/workspace/note':'POST','ii/workspace/report':'GET|HEAD'}
          for uri,method in targets.items():
              items=[x for x in data if x['uri']==uri]
              assert len(items)==1, (uri,items)
              assert method in items[0]['method'], (uri,items[0]['method'])
          print('II_VS4_CI_ROUTES_AND_BLADE=PASS')
          PY