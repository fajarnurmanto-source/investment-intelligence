name: II VS3 Laravel Bridge CI
on:
  pull_request:
    branches: [development]
    paths:
      - 'hybrid_vs3/**'
      - '.github/workflows/ii-vs3.yml'
  push:
    branches: [development]
    paths:
      - 'hybrid_vs3/**'
      - '.github/workflows/ii-vs3.yml'
permissions:
  contents: read
jobs:
  laravel-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Check overlay syntax and reproduce Laravel route registration
        shell: bash
        run: |
          set -euo pipefail
          php -l hybrid_vs3/app/Http/Controllers/CompanyResearchController.php
          composer create-project laravel/laravel /tmp/ii-vs3-ci-laravel '^13.0' --no-interaction --prefer-dist
          cd /tmp/ii-vs3-ci-laravel
          cp "$GITHUB_WORKSPACE/hybrid_vs3/app/Http/Controllers/CompanyResearchController.php" app/Http/Controllers/
          mkdir -p resources/views/ii
          cp "$GITHUB_WORKSPACE/hybrid_vs3/resources/views/ii/company.blade.php" resources/views/ii/
          cat "$GITHUB_WORKSPACE/hybrid_vs3/route_fragment.php" >> routes/web.php
          python3 - <<'PY'
          from pathlib import Path
          s = Path('config/services.php')
          t = s.read_text()
          i = t.rfind('];')
          assert i >= 0
          insert = Path(__import__('os').environ['GITHUB_WORKSPACE']+'/hybrid_vs3/service_fragment.php').read_text()
          s.write_text(t[:i] + insert + '\n' + t[i:])
          PY
          php -l routes/web.php
          php -l config/services.php
          php artisan route:list --path=ii