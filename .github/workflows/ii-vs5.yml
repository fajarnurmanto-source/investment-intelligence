name: II VS5 Persistent Cases CI
on:
  pull_request:
    branches: [development]
    paths: ['hybrid_vs5/**', '.github/workflows/ii-vs5.yml']
  push:
    branches: [development]
    paths: ['hybrid_vs5/**', '.github/workflows/ii-vs5.yml']
permissions:
  contents: read
jobs:
  persistent-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Reconstruct Laravel, routes, views, and synthetic SQLite workflow
        shell: bash
        run: |
          set -euo pipefail
          php -l hybrid_vs5/app/Http/Controllers/ResearchCaseController.php
          php -l hybrid_vs5/database/migrations/2026_10_25_000001_create_ii_vs5_research_cases.php
          composer create-project laravel/laravel /tmp/ii-vs5-ci '^13.0' --no-interaction --prefer-dist
          cd /tmp/ii-vs5-ci
          cp "$GITHUB_WORKSPACE/hybrid_vs5/app/Http/Controllers/ResearchCaseController.php" app/Http/Controllers/
          mkdir -p resources/views/ii
          cp "$GITHUB_WORKSPACE/hybrid_vs5/resources/views/ii/"*.blade.php resources/views/ii/
          cp "$GITHUB_WORKSPACE/hybrid_vs5/database/migrations/2026_10_25_000001_create_ii_vs5_research_cases.php" database/migrations/
          cat "$GITHUB_WORKSPACE/hybrid_vs5/route_fragment.php" >> routes/web.php
          php -l routes/web.php
          php artisan view:cache
          php artisan route:list --path=ii/cases --json > /tmp/ii-vs5-routes.json
          python3 - <<'PYROUTES'
          import json
          r=json.load(open('/tmp/ii-vs5-routes.json'))
          expected={('ii/cases','GET|HEAD'),('ii/cases','POST'),('ii/cases/{id}','GET|HEAD'),('ii/cases/{id}/note','POST'),('ii/cases/{id}/report','GET|HEAD')}
          actual={(x['uri'],x['method']) for x in r}
          assert len(r)==5 and actual==expected, (r,expected)
          print('II_VS5_CI_ROUTES=PASS')
          PYROUTES
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force
          php -r '
          require "vendor/autoload.php";
          $app=require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=Illuminate\Support\Facades\DB::class;
          if (!Illuminate\Support\Facades\Schema::hasTable("ii_vs5_cases") || !Illuminate\Support\Facades\Schema::hasTable("ii_vs5_events")) exit(10);
          $id="00000000-0000-4000-8000-000000000005";
          $db::table("ii_vs5_cases")->insert(["id"=>$id,"ticker"=>"DEMO2","title"=>"Synthetic CI case","company_name"=>"DEMO2","source_id"=>"GENERATED_DEMO","review_status"=>"OPEN","created_at"=>now(),"updated_at"=>now()]);
          $db::table("ii_vs5_events")->insert(["id"=>"00000000-0000-4000-8000-000000000006","case_id"=>$id,"kind"=>"REVIEW_NOTE","review_status"=>"NEEDS_EVIDENCE","finding"=>"CI synthetic evidence note","created_at"=>now()]);
          if ($db::table("ii_vs5_cases")->where("id",$id)->count()!==1 || $db::table("ii_vs5_events")->where("case_id",$id)->count()!==1) exit(11);
          echo "II_VS5_CI_SQLITE_PERSISTENCE=PASS\n";
          '