name: II Local BYOK Cutover CI

on:
  pull_request:
    paths:
      - 'laravel_app/**'
      - 'tools/installer/**'
      - 'docs/ops/II_BYOK_LOCAL_MANDATORY_ARCHITECTURE_20261124.md'
      - '.github/workflows/ii-local-byok.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  byok-laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: laravel_app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan test
      - run: php artisan route:list
      - name: Prove legacy shared-key feed is gone
        run: |
          ! grep -R 'II_IDXAPI_KEY\|ii:idxapi:sync\|fundamentals.idxapi.free-review' app config routes resources
      - name: Audit forbidden bridge runtime
        run: '! grep -R -E "FastAPI|127\.0\.0\.1:8811|subprocess.*python" app config routes resources --exclude-dir=vendor'
  byok-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, openssl, zip, fileinfo
          tools: composer:v2
          coverage: none
      - name: Verify Windows DPAPI roundtrip using disposable synthetic input
        shell: pwsh
        run: |
          $helper = ".\\laravel_app\\app\\Services\\WindowsDpapiCredential.ps1"
          $exe = Join-Path $env:SystemRoot "System32\\WindowsPowerShell\\v1.0\\powershell.exe"
          $original = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("CI_SYNTHETIC_DPAPI_ONLY"))
          $cipher = $original | & $exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $helper protect
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($cipher)) { throw "BYOK_DPAPI_HELPER_PROTECT_FAILED" }
          $plain = $cipher | & $exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $helper unprotect
          if ($LASTEXITCODE -ne 0 -or $plain.Trim() -ne $original) { throw "BYOK_DPAPI_HELPER_ROUNDTRIP_FAILED" }
          Write-Host "BYOK_DPAPI_HELPER_ROUNDTRIP=PASS"
      - name: Windows isolated Laravel regression
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ".\tools\testing\Invoke-II-AutomatedTests.ps1"
