[PHP]
engine = On
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 512M
max_execution_time = 90
post_max_size = 32M
upload_max_filesize = 32M
default_charset = "UTF-8"
date.timezone = "Asia/Jakarta"
extension_dir = "${II_PHP_EXTENSION_DIR}"

extension = curl
extension = fileinfo
extension = intl
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = zip

[Session]
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1

[Assertion]
zend.assertions = -1

; II V11 HTTPS trust: managed FrankenPHP inherits II_RUNTIME_ROOT before
; loading this php.ini. Provision certs/cacert.pem using the approved
; Mozilla CA extraction bundle; keep TLS verification enabled.
[curl]
curl.cainfo = "${II_RUNTIME_ROOT}/certs/cacert.pem"

[openssl]
openssl.cafile = "${II_RUNTIME_ROOT}/certs/cacert.pem"
